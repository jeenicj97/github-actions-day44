name: Run Shell Script

on:
  push:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make the script executable
        run: chmod +x scripts/backup.sh

      - name: Exit
        run: exit 1

      - name: Run script
        run: ./scripts/backup.sh
   
